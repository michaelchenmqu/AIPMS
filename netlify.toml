# Netlify configuration for AIPMS (Next.js full-stack app).
#
# Requires DATABASE_URL (Postgres — Neon, Supabase, etc.), AUTH_SECRET, and
# optionally ANTHROPIC_API_KEY set in the Netlify site's environment
# variables. See README.md.

[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"
